plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
}

var isBuildingBitwig = rootProject.getName().equals("bitwig")

if (isBuildingBitwig)
{
    dependencies {
        implementation project(':base-extensions-api')
    }
}
else
{
    repositories {
        maven {
            url = uri('https://maven.bitwig.com/')
        }
    }

    dependencies {
        implementation 'com.bitwig:extension-api:25'
    }
}

group = 'com.bitwig.extensions'
description = 'Bitwig Studio Extensions (Github)'

// Set default version from version file
def versionFile = file('version.txt')
if (versionFile.exists()) {
    project.version = versionFile.text.trim().toInteger()
} else {
    project.version = 0
}

java {
    sourceCompatibility = JavaVersion.VERSION_21

    jar {
        archiveFileName = "jetaitry${project.version}.bwextension"
        destinationDirectory = file("C:/Users/danil/Documents/Bitwig Studio/Extensions")
    }
}

task incrementVersion {
    doLast {
        def version = versionFile.exists() ? versionFile.text.trim().toInteger() : 0
        version++
        versionFile.text = version.toString()
        project.version = version
        println "Version incremented to: ${version}"
    }
}

jar.dependsOn incrementVersion
